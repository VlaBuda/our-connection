# Deploys the "notify" Edge Function to Supabase on every change, so nobody has to paste code by hand.
# Needs a repository secret SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens). Without it the job just skips.
name: Deploy notify function
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        id: tok
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::Додай секрет SUPABASE_ACCESS_TOKEN, щоб функція оновлювалась сама"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.tok.outputs.skip != '1'
        with:
          version: latest
      - name: Deploy (Verify JWT off)
        if: steps.tok.outputs.skip != '1'
        run: supabase functions deploy notify --project-ref usucbzsikqieaywmfkfd --no-verify-jwt --use-api
